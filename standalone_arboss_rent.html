    // ==========================================
    // POS ORDER MODAL (SOTUVCHILAR UCHUN 1 DAQIQALIK TEZKOR BUYURTMA)
    // ==========================================
    function PosOrderModal({ data, setData, t, onClose, onComplete }) {
      // 1. Client state
      const [clientSearch, setClientSearch] = useState('');
      const [selectedClient, setSelectedClient] = useState(null);
      const [newClientOpen, setNewClientOpen] = useState(false);
      const [newClientForm, setNewClientForm] = useState({ name: '', phone: '', passport: '', jshshir: '' });

      // 2. Tools state
      const [selectedTools, setSelectedTools] = useState([]);
      const [rentDays, setRentDays] = useState(3);

      // 3. Machinery state
      const [machineryActive, setMachineryActive] = useState(false);
      const [selectedVehicle, setSelectedVehicle] = useState(null);
      const [location, setLocation] = useState('');
      const [time, setTime] = useState('2026-04-11 10:00');
      const [estHours, setEstHours] = useState(3);

      // Tools calculations
      const toolsSum = selectedTools.reduce((s, it) => s + (it.daily * rentDays), 0);
      const depositSum = selectedTools.reduce((s, it) => s + it.deposit, 0);

      // Machinery calculations
      let machinerySum = 0;
      let companyMachineryPart = 0;
      let partnerPart = 0;

      if (machineryActive && selectedVehicle) {
        if (selectedVehicle.hourlyRate) {
          machinerySum = selectedVehicle.hourlyRate * estHours;
        } else if (selectedVehicle.tripCityRate) {
          machinerySum = selectedVehicle.tripCityRate * estHours; // estHours used as trips
        }
        const commPct = selectedVehicle.partnerCommission || 15;
        companyMachineryPart = Math.round(machinerySum * (commPct / 100));
        partnerPart = machinerySum - companyMachineryPart;
      }

      const totalOrderSum = toolsSum + machinerySum;
      const totalCompanyRevenue = toolsSum + companyMachineryPart;

      // Filtered clients for quick pick
      const matchingClients = useMemo(() => {
        if (!clientSearch.trim()) return [];
        return data.customers.filter(c =>
          c.name.toLowerCase().includes(clientSearch.toLowerCase()) ||
          c.phone.includes(clientSearch)
        ).slice(0, 5);
      }, [clientSearch, data.customers]);

      // All available fleet vehicles across partners
      const availableVehicles = useMemo(() => {
        const list = [];
        data.partners.forEach(p => {
          p.fleet.forEach(f => {
            if (f.status === 'bosh') {
              list.push({ ...f, partnerName: p.name, partnerCommission: p.commissionPct });
            }
          });
        });
        return list;
      }, [data.partners]);

      const handleCreateQuickClient = () => {
        if (!newClientForm.name || !newClientForm.phone) return;
        const newC = {
          id: 'C-' + (data.customers.length + 1),
          ...newClientForm,
          blacklist: false,
          totalSpent: 0,
          debt: 0,
          ordersCount: 0
        };
        setData({ ...data, customers: [newC, ...data.customers] });
        setSelectedClient(newC);
        setNewClientOpen(false);
      };

      const handleSubmitOrder = () => {
        if (!selectedClient) {
          alert("Iltimos, avval mijozni tanlang yoki kiriting!");
          return;
        }
        if (selectedTools.length === 0 && !machineryActive) {
          alert("Iltimos, kamida bitta asbob yoki maxsus texnika tanlang!");
          return;
        }

        const newId = 'ORD-' + Math.floor(100 + Math.random() * 900);
        const orderRecord = {
          id: newId,
          date: new Date().toISOString().replace('T', ' ').slice(0, 16),
          customerName: selectedClient.name,
          customerPhone: selectedClient.phone,
          customerPassport: selectedClient.passport,
          customerJshshir: selectedClient.jshshir,
          tools: selectedTools.map(t => ({ name: t.name, days: rentDays, daily: t.daily, deposit: t.deposit, sum: t.daily * rentDays })),
          machinery: machineryActive && selectedVehicle ? {
            title: selectedVehicle.title,
            partnerName: selectedVehicle.partnerName,
            location,
            time,
            estHours,
            hourlyRate: selectedVehicle.hourlyRate || selectedVehicle.tripCityRate,
            machinerySum,
            commissionPct: selectedVehicle.partnerCommission,
            companyPart: companyMachineryPart,
            partnerPart: partnerPart,
          } : null,
          totalSum: totalOrderSum,
          depositSum,
          paidSum: totalOrderSum,
          debtSum: 0,
          companyRevenue: totalCompanyRevenue,
          partnerRevenue: partnerPart,
          status: 'jarayonda',
          type: selectedTools.length > 0 && machineryActive ? 'mixed' : machineryActive ? 'machinery' : 'tool'
        };

        // Update tool statuses to rented
        const updatedTools = data.tools.map(t => {
          if (selectedTools.find(st => st.id === t.id)) {
            return { ...t, status: 'ijarada' };
          }
          return t;
        });

        setData({
          ...data,
          tools: updatedTools,
          orders: [orderRecord, ...data.orders],
        });

        onComplete(orderRecord);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
          <div className="bg-[#0f172a] border border-slate-800 rounded-2xl w-full max-w-4xl p-6 my-8 space-y-6 shadow-2xl">
            <div className="flex items-center justify-between pb-3 border-b border-slate-800">
              <div className="flex items-center gap-2">
                <span className="text-xl">🛒</span>
                <h3 className="text-base font-extrabold text-white">Sotuvchilar uchun Tezkor Buyurtma (POS)</h3>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-white bg-slate-800">✕</button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
              {/* 1. MIJOZ QISMI */}
              <div className="p-4 rounded-xl border border-slate-800 bg-[#0c1222] space-y-3">
                <div className="flex items-center justify-between font-bold text-white">
                  <span>1. Mijoz qismi</span>
                  <button onClick={() => setNewClientOpen(!newClientOpen)} className="text-blue-400 hover:underline">
                    {newClientOpen ? 'Bekor qilish' : '+ Yangi mijoz'}
                  </button>
                </div>

                {!selectedClient && !newClientOpen && (
                  <div className="relative">
                    <input
                      type="text"
                      placeholder="Mijoz ismi yoki tel raqamini yozing..."
                      value={clientSearch}
                      onChange={e => setClientSearch(e.target.value)}
                      className="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white"
                    />
                    {matchingClients.length > 0 && (
                      <div className="absolute top-full left-0 right-0 mt-1 rounded-lg bg-slate-800 border border-slate-700 shadow-xl z-20 max-h-40 overflow-y-auto">
                        {matchingClients.map(c => (
                          <div
                            key={c.id}
                            onClick={() => { setSelectedClient(c); setClientSearch(''); }}
                            className="p-2 hover:bg-slate-700 cursor-pointer flex justify-between items-center"
                          >
                            <span className="font-semibold text-white">{c.name}</span>
                            <span className="text-[10px] text-slate-400">{c.phone}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {newClientOpen && (
                  <div className="p-3 rounded-lg bg-slate-800/80 border border-slate-700 space-y-2">
                    <input placeholder="F.I.O. *" value={newClientForm.name} onChange={e => setNewClientForm({ ...newClientForm, name: e.target.value })} className="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white" />
                    <input placeholder="Telefon raqam *" value={newClientForm.phone} onChange={e => setNewClientForm({ ...newClientForm, phone: e.target.value })} className="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white" />
                    <div className="grid grid-cols-2 gap-2">
                      <input placeholder="Pasport / ID" value={newClientForm.passport} onChange={e => setNewClientForm({ ...newClientForm, passport: e.target.value })} className="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white" />
                      <input placeholder="JSHSHIR" value={newClientForm.jshshir} onChange={e => setNewClientForm({ ...newClientForm, jshshir: e.target.value })} className="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white" />

                    <button onClick={handleCreateQuickClient} className="w-full py-1.5 rounded bg-blue-600 text-white font-bold">Mijozni saqlash va tanlash</button>
                  </div>
                )}

                {selectedClient && (
                  <div className="p-3 rounded-lg bg-blue-950/40 border border-blue-800 flex justify-between items-center">
                    <div>
                      <div className="font-bold text-white text-sm">{selectedClient.name}</div>
                      <div className="text-slate-400">{selectedClient.phone}</div>
                      <div className="text-[10px] text-slate-500 font-mono">Pasport: {selectedClient.passport} • JSHSHIR: {selectedClient.jshshir}</div>
                      {selectedClient.blacklist && (
                        <div className="text-[10px] text-red-400 font-bold mt-1">⚠️ DIQQAT: Mijoz qora ro'yxatda!</div>
                      )}
                    </div>
                    <button onClick={() => setSelectedClient(null)} className="text-red-400 hover:text-red-300">✕</button>
                  </div>

    // ==========================================
    // AQLLI OPTIMIZER KALKULYATOR (SMART LIFT VS GRUZCHIK)
    // ==========================================
    function SmartOptimizerModal({ t, onClose, onApplyToPos }) {
      const [weight, setWeight] = useState(800);
      const [floor, setFloor] = useState(5);
      const [hasLift, setHasLift] = useState(false);
      const [oversized, setOversized] = useState(true);

      // FORMULALAR:
      // Gruzchiklar: 100 000 + (kg * 50) + (kg * qavat * (lift ? 20 : 80)) + Gabarit (50 000).
      const gruzchikPrice = 100000 + (weight * 50) + (weight * floor * (hasLift ? 20 : 80)) + (oversized ? 50000 : 0);

      // Fasad lifti: agar qavat >= 3 va kg >= 600 bo'lsa, lift (350 000/soat) + 2 ishchi (150 000) = 500 000 so'm.
      const isLiftEligible = floor >= 3 && weight >= 600;
      const liftPrice = isLiftEligible ? 500000 : 650000;

      const optimalOption = liftPrice < gruzchikPrice ? 'lift' : 'gruzchik';
      const savedMoney = Math.abs(gruzchikPrice - liftPrice);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-[#0f172a] border border-slate-800 rounded-2xl w-full max-w-2xl p-6 space-y-6 shadow-2xl">
            <div className="flex items-center justify-between pb-3 border-b border-slate-800">
              <div className="flex items-center gap-2">
                <span className="text-xl">⚡</span>
                <h3 className="text-base font-extrabold text-white">Aqlli Optimizer Kalkulyator (Fasad Lift vs Gruzchik)</h3>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-white bg-slate-800">✕</button>
            </div>

            <div className="grid grid-cols-2 gap-4 text-xs">
              <div>
                <label className="text-slate-400">{t('weightKg')}</label>
                <input
                  type="number"
                  value={weight}
                  onChange={e => setWeight(Number(e.target.value) || 0)}
                  className="w-full mt-1 p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white font-bold"
                />
              </div>
              <div>
                <label className="text-slate-400">{t('floor')}</label>
                <input
                  type="number"
                  min="1"
                  max="25"
                  value={floor}
                  onChange={e => setFloor(Number(e.target.value) || 1)}
                  className="w-full mt-1 p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white font-bold"
                />
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="liftCheck"
                  checked={hasLift}
                  onChange={e => setHasLift(e.target.checked)}
                  className="h-4 w-4 rounded bg-slate-800 border-slate-700"
                />
                <label htmlFor="liftCheck" className="text-slate-300 font-medium cursor-pointer">{t('hasCargoLift')}</label>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="oversizedCheck"
                  checked={oversized}
                  onChange={e => setOversized(e.target.checked)}
                  className="h-4 w-4 rounded bg-slate-800 border-slate-700"
                />
                <label htmlFor="oversizedCheck" className="text-slate-300 font-medium cursor-pointer">{t('oversized')}</label>
              </div>
            </div>

            {/* RESULTS COMPARISON CARDS */}
            <div className="grid grid-cols-2 gap-4 text-xs">
              {/* GRUZCHIK CARD */}
              <div className={`p-4 rounded-xl border relative ${
                optimalOption === 'gruzchik'
                  ? 'border-emerald-500 bg-emerald-950/20'
                  : 'border-slate-800 bg-[#0c1222]'
              }`}>
                {optimalOption === 'gruzchik' && (
                  <span className="absolute -top-3 left-4 px-2 py-0.5 rounded-full bg-emerald-500 text-white text-[10px] font-extrabold">
                    ENG OPTIMAL VARIANT ⭐️
                  </span>
                )}
                <h4 className="font-bold text-white text-sm mb-2">👷♂️ Gruzchiklar Brigadasi</h4>
                <div className="text-xl font-extrabold text-emerald-400">{formatMoney(gruzchikPrice)}</div>
                <p className="text-[11px] text-slate-400 mt-2">
                  Taxminiy vaqt: ~3-4 soat<br />
                  Ishchilar: {Math.ceil(weight / 250) + 1} nafar
                </p>
              </div>

              {/* FASAD LIFT CARD */}
              <div className={`p-4 rounded-xl border relative ${
                optimalOption === 'lift'
                  ? 'border-emerald-500 bg-emerald-950/20'
                  : 'border-slate-800 bg-[#0c1222]'
              }`}>
                {optimalOption === 'lift' && (
                  <span className="absolute -top-3 left-4 px-2 py-0.5 rounded-full bg-emerald-500 text-white text-[10px] font-extrabold">
                    ENG OPTIMAL VARIANT ⭐️
                  </span>
                )}
                <h4 className="font-bold text-white text-sm mb-2">🏗️ Fasad Avtolifti</h4>
                <div className="text-xl font-extrabold text-emerald-400">{formatMoney(liftPrice)}</div>
                <p className="text-[11px] text-slate-400 mt-2">
                  Taxminiy vaqt: ~45 daqiqa<br />
                  Tejalgan mablag': <strong className="text-emerald-300">{formatMoney(savedMoney)}</strong>
                </p>
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
              <button onClick={onClose} className="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs">Yopish</button>
              <button onClick={onApplyToPos} className="px-4 py-2 rounded-lg bg-blue-600 text-white font-bold text-xs">
                Buyurtmaga qo'llash (POS ga o'tish)
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CreateFleetModal({ partnerId, data, setData, t, onClose }) {
      const partner = data.partners.find(p => p.id === partnerId);
      const [type, setType] = useState('avtokran');
      const [form, setForm] = useState({
        title: '',
        specs: '',
        hourlyRate: 300000,
        tripCityRate: 500000,
        driver: '',
        plate: '',
        image: ''
      });

      const handleSave = (e) => {
        e.preventDefault();
        const fId = 'F-' + (Math.floor(100 + Math.random() * 900));
        const newFleet = {
          id: fId,
          type,
          title: form.title,
          specs: form.specs,
          hourlyRate: Number(form.hourlyRate) || 0,
          tripCityRate: Number(form.tripCityRate) || 0,
          driver: form.driver,
          plate: form.plate,
          status: 'bosh',

        const updatedPartners = data.partners.map(p => {

            return { ...p, fleet: [...p.fleet, newFleet] };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">

            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span>GAROV (ZALOG):</span>
              <strong>{formatMoney(order.depositSum)}</strong>
            </div>
          </div>

          <hr style={{ borderTop: '1px dashed #000', margin: '8px 0' }} />

          <div style={{ textAlign: 'center', fontSize: '10px', marginTop: '10px' }}>
            <p>Uskunani o'z vaqtida va soz holatda qaytarish shart.</p>
            <p>Xaridingiz uchun rahmat!</p>
          </div>
        </div>
      );
    }

    function PrintContractView({ order, location }) {
      return (
        <div style={{ maxWidth: '210mm', margin: '0 auto', padding: '20mm', fontFamily: 'Arial, sans-serif', fontSize: '12px', lineHeight: '1.5' }}>
          <div style={{ textAlign: 'center', marginBottom: '20px' }}>
            <h1 style={{ fontSize: '18px', fontWeight: 'bold', margin: '0' }}>QURILISH USKUNALARI IJARASI VA QABUL QILISH-TOPSHIRISH SHARTNOMASI</h1>
            <p style={{ margin: '5px 0' }}>Shartnoma № {order.id} • Sana: {order.date}</p>
          </div>

          <p>
            Bir tomondan <strong>"ARBOSS RENT" MCHJ</strong> (keyingi o'rinlarda "Ijaraga beruvchi", Manzil: {location}), ikkinchi tomondan fuqaro <strong>{order.customerName}</strong> (Pasport: {order.customerPassport}, JSHSHIR: {order.customerJshshir}, Tel: {order.customerPhone}, keyingi o'rinlarda "Ijarachi"), quyidagilar haqida mazkur shartnomani tuzdilar:
          </p>

          <h3 style={{ fontSize: '13px', fontWeight: 'bold', marginTop: '15px', marginBottom: '5px' }}>1. SHARTNOMA PREDMETI VA ASBOBLAR RO'YXATI</h3>
          <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '15px' }} border="1">
            <thead>
              <tr style={{ background: '#f2f2f2' }}>
                <th style={{ padding: '6px' }}>№</th>
                <th style={{ padding: '6px' }}>Uskuna nomi</th>
                <th style={{ padding: '6px' }}>Muddat (kun)</th>
                <th style={{ padding: '6px' }}>Kunlik narx</th>
                <th style={{ padding: '6px' }}>Garov summasi</th>
                <th style={{ padding: '6px' }}>Jami ijara</th>
              </tr>
            </thead>
            <tbody>
              {order.tools && order.tools.map((t, idx) => (
                <tr key={idx}>
                  <td style={{ padding: '6px', textAlign: 'center' }}>{idx + 1}</td>
                  <td style={{ padding: '6px' }}>{t.name}</td>
                  <td style={{ padding: '6px', textAlign: 'center' }}>{t.days}</td>
                  <td style={{ padding: '6px' }}>{formatMoney(t.daily)}</td>
                  <td style={{ padding: '6px' }}>{formatMoney(t.deposit)}</td>
                  <td style={{ padding: '6px', fontWeight: 'bold' }}>{formatMoney(t.sum)}</td>
                </tr>
              ))}
            </tbody>
          </table>

          <h3 style={{ fontSize: '13px', fontWeight: 'bold', marginTop: '15px', marginBottom: '5px' }}>2. HISOB-KITOB VA GAROV SHARTLARI</h3>
          <p>
            2.1. Jami ijara haqi: <strong>{formatMoney(order.totalSum)}</strong> to'liq to'landi.<br />
            2.2. Garov sifatida topshirilgan summa: <strong>{formatMoney(order.depositSum)}</strong>. Uskuna butun va soz holda qaytarilgach garov to'liq qaytariladi.<br />
            2.3. Ijarachi uskunani muddatidan kechiktirsa, har bir o'tgan kun uchun 2 karra kunlik ijara haqi hisoblanadi.
          </p>

          <h3 style={{ fontSize: '13px', fontWeight: 'bold', marginTop: '15px', marginBottom: '5px' }}>3. TOMONLARNING JAVOBGARLIGI VA IMZOLARI</h3>
          <p>
            Ijarachi uskunaning texnik xavfsizlik qoidalariga rioya qilishi, unga shikast yetkazmasligi va uchinchi shaxslarga bermaslik majburiyatini oladi.
          </p>

          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '40px' }}>
            <div style={{ width: '45%' }}>
              <p><strong>Ijaraga beruvchi:</strong><br />"ARBOSS RENT" MCHJ<br />Manzil: {location}<br /><br />Imzo: _______________ (M.O'.)</p>
            </div>
            <div style={{ width: '45%' }}>
              <p><strong>Ijarachi:</strong><br />{order.customerName}<br />Pasport: {order.customerPassport}<br /><br />Imzo: _______________</p>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // FLOATING AI COPILOT WIDGET
    // ==========================================
    function AiCopilotWidget({ open, setOpen, data, setData, t }) {
      const [messages, setMessages] = useState([
        { role: 'assistant', text: 'Assalomu alaykum! Men Arboss AI assistentiman. "Ali akaga 2 kunga perforator berdim" deb yozsangiz, darhol buyurtma yarataman yoki ombor holatini tahlil qilaman.' }
      ]);
      const [input, setInput] = useState('');
      const [apiKeyModal, setApiKeyModal] = useState(false);
      const [apiKey, setApiKey] = useState(data.geminiApiKey || '');

      const handleSend = () => {
        if (!input.trim()) return;
        const userText = input.trim();
        setInput('');

        const newMessages = [...messages, { role: 'user', text: userText }];
        setMessages(newMessages);

        // Simple Natural Language parser for quick orders
        const lower = userText.toLowerCase();
        if (lower.includes('perforator') && (lower.includes('berdim') || lower.includes('yarat'))) {
          setTimeout(() => {
            setMessages(prev => [
              ...prev,
              { role: 'assistant', text: 'Buyruq qabul qilindi! Perforator Bosch uchun 2 kunlik ijara buyurtmasi tayyorlandi va ro\'yxatga kiritildi.' }
            ]);
          }, 600);
        } else if (lower.includes('bo\'sh') || lower.includes('nimalar bor')) {
          const freeTools = data.tools.filter(t => t.status === 'bosh').map(t => t.name).join(', ');
          setTimeout(() => {
            setMessages(prev => [
              ...prev,
              { role: 'assistant', text: `Hozirda omborda bo'sh uskunalar: ${freeTools || 'Barcha uskunalar band!'}` }
            ]);
          }, 600);
        } else {
          setTimeout(() => {
            setMessages(prev => [
              ...prev,
              { role: 'assistant', text: 'Xabaringiz tahlil qilindi. Qanday asbob yoki texnika kerakligini aytsangiz, tezkor hisoblab beraman.' }
            ]);
          }, 600);
        }
      };

      const saveKey = () => {
        setData({ ...data, geminiApiKey: apiKey.trim() });
        setApiKeyModal(false);
        alert("API kalit muvaffaqiyatli saqlandi!");
      };

      return (
        <>
          {/* FLOATING TRIGGER BUTTON */}
          <div className="fixed bottom-5 right-5 z-40">
            <button
              onClick={() => setOpen(!open)}
              className="h-14 w-14 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center text-2xl shadow-xl shadow-blue-600/40 hover:scale-105 transition"
            >
              🤖
            </button>
          </div>

          {/* CHAT WINDOW */}
          {open && (
            <div className="fixed bottom-22 right-5 z-40 w-96 max-w-[calc(100vw-2.5rem)] rounded-2xl border border-slate-800 bg-[#0f172a] shadow-2xl flex flex-col h-[480px]">
              <div className="p-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-900/60 rounded-t-2xl">
                <div className="flex items-center gap-2">
                  <span className="text-xl">🤖</span>
                  <div>
                    <h4 className="font-bold text-xs text-white">Arboss AI Copilot</h4>
                    <p className="text-[10px] text-emerald-400">● Onlayn (Agent rejimida)</p>
                  </div>
                </div>
                <div className="flex items-center gap-1.5">
                  <button onClick={() => setApiKeyModal(true)} title="API Kalit sozlamasi" className="text-slate-400 hover:text-white text-xs px-2 py-1 rounded bg-slate-800">⚙️</button>
                  <button onClick={() => setOpen(false)} className="text-slate-400 hover:text-white text-xs px-2 py-1 rounded bg-slate-800">✕</button>
                </div>
              </div>

              <div className="flex-1 p-3.5 overflow-y-auto space-y-2.5 text-xs">
                {messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`p-3 rounded-2xl max-w-[85%] leading-relaxed ${
                      m.role === 'user' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700/60'
                    }`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              <div className="p-3 border-t border-slate-800 flex gap-2">
                <input
                  type="text"
                  placeholder="AI ga buyruq bering..."
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleSend()}
                  className="flex-1 p-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none"
                />
                <button
                  onClick={handleSend}
                  className="px-3.5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs"
                >
                  ➤
                </button>
              </div>
            </div>
          )}

          {/* API KEY SETTINGS MODAL */}
          {apiKeyModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="bg-[#0f172a] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4">
                <h3 className="text-sm font-bold text-white">Google Gemini API Kalit sozlamasi</h3>
                <p className="text-xs text-slate-400">
                  Yangi "AQ." yoki eski "AIza..." formatidagi har qanday Gemini API kalitingizni kiriting:
                </p>
                <input
                  type="password"
                  placeholder="AQ.xxxx yoki AIzaxxxx..."
                  value={apiKey}
                  onChange={e => setApiKey(e.target.value)}
                  className="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white"
                />
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setApiKeyModal(false)} className="px-4 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Bekor qilish</button>
                  <button onClick={saveKey} className="px-4 py-2 rounded-lg bg-blue-600 text-xs font-bold text-white">Saqlash</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    // Render the App into DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
